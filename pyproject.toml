[project]
name = "sporameteo"
version = "0.1.0"
description = "Epic 1 validation experiments for SporaMeteo."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cdsapi>=0.7.7",
    "django>=6.0",
    "django-ninja>=1.4.3",
    "django-tasks-db>=0.13,<0.14",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "osmium>=4.3.1",
    "pyarrow>=26.0.0",
    "psycopg[binary]>=3.2.10",
    "pyproj>=3.8.0",
    "pyshp>=3.1.6",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "gunicorn>=26.2.0",
    "whitenoise>=6.12.0",
    "dj-database-url>=3.1.2",
    "django-anymail[resend]>=15.2",
    "sentry-sdk[django]>=2.70",
    "omfiles>=1.2.0",
]

[project.scripts]
sporameteo = "sporameteo.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-django>=4.11",
    "pytest-socket>=0.7.0",
    "pytest-playwright>=0.7.1",
    "pytest-xdist>=3.8.0",
    "pytest-repeat>=0.9.4",
    "openapi-spec-validator>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sporameteo"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = [
    "--allow-hosts=127.0.0.1,127.0.1.1,::1",
    "--browser=chromium",
    "--browser=webkit",
]
testpaths = ["tests"]
pythonpath = ["src", "apps/api", "apps/application"]
