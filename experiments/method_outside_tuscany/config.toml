description = "Calculate the v5 and the 20-day cold candidate estimates for every day of the last 12 months at 10 forest places outside Tuscany and one near Pistoia, from the Open-Meteo files alone, and set it next to porcini finds on GBIF and iNaturalist."
seed = 42
time_limit_minutes = 30

[settings]
forest_build_version = "italy-forest-copernicus-2018-v1"
# Days of weather the method reads before a day: 30 days of moisture history.
history_days = 30
first_day = "2025-10-17"
last_day = "2026-10-16"
# The run stops before reading when the estimated download is larger than this.
max_read_megabytes = 300
# Extra bytes fetched after each requested range. The places are far apart, so a small value saves bytes.
read_ahead_bytes = 4096
threads = 8
# Weather cells this many degrees from a place are candidates for its forest.
search_radius_deg = 0.6

# Finds counted around the centre of each weather cell.
find_radius_km = 30
duplicate_distance_m = 100
earliest_find_date = "1990-01-01"
not_find_kinds = ["MATERIAL_SAMPLE"]
gbif_taxon_keys = [5954958, 8733688, 5954691, 5954949]
gbif_country = "IT"
gbif_page_size = 300
inat_taxon_ids = [48701, 333772, 350216, 335942]
# Italy.
inat_place_id = 6973
pause_seconds = 1.0

