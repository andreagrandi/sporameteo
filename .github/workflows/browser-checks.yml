name: Browser checks

on:
  workflow_call:
    inputs:
      browser:
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each group runs on its own machine at the same time.
        shard: [1, 2, 3]
    services:
      database:
        image: imresamu/postgis:17-3.5-bookworm@sha256:35fe7dceda62bfe7d2965b0ba78d915ff9f901b5e0466d633ecc58421b5b5210
        env:
          POSTGRES_DB: sporameteo
          POSTGRES_USER: sporameteo
          POSTGRES_PASSWORD: replace-with-a-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sporameteo -d sporameteo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPORAMETEO_DJANGO_SECRET_KEY: django-insecure-ci-placeholder
      SPORAMETEO_DB_NAME: sporameteo
      SPORAMETEO_DB_USER: sporameteo
      SPORAMETEO_DB_PASSWORD: replace-with-a-ci-password
      SPORAMETEO_DB_HOST: 127.0.0.1
      SPORAMETEO_DB_PORT: "5432"
      SPORAMETEO_E2E_SHARD: "${{ matrix.shard }}/3"
    steps:
      - name: Refresh the Ubuntu package lists
        # The cache action does not refresh them, and on a cache miss the runner's old lists can point at removed files.
        run: sudo apt-get update
      - name: Install system packages
        # The packages come from the Actions cache, so a slow Ubuntu mirror only matters when this list changes.
        # After gdal-bin and gettext come the Chromium libraries from the Ubuntu 24.04 list in Playwright 1.63,
        # which playwright install --with-deps would otherwise download on every run.
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            gdal-bin gettext
            xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 xfonts-cyrillic xfonts-scalable
            fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3
            libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node for map checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/map_checks/package-lock.json
      - name: Install map check dependencies
        run: npm ci --prefix tools/map_checks
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install locked environment
        run: uv sync --locked
      - name: Compile translation catalogs
        run: uv run python apps/application/manage.py compilemessages --ignore .venv --locale it --locale en
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Restore browser download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browser }}
      - name: Install browsers
        # With a restored download this does nothing. The system packages come from the step above.
        run: uv run playwright install ${{ inputs.browser }}
      - name: Apply migrations
        run: uv run python apps/application/manage.py migrate --noinput
      - name: Run browser checks
        run: uv run pytest tests/e2e -n 4 -o addopts="--allow-hosts=127.0.0.1,127.0.1.1,::1" --browser=${{ inputs.browser }} --durations=15
