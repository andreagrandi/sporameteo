name: Checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  # A cancelled run on master could stop a deploy halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install translation tools
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: gettext
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build CSS
        run: npm run build:css
      - name: Check generated CSS is committed
        run: git diff --exit-code -- apps/application/web_ui/static/web_ui/app.css apps/application/web_ui/static/web_ui/landing.css
      - name: Check translation catalogs
        run: |
          msgfmt --check apps/application/web_ui/locale/it/LC_MESSAGES/django.po
          msgfmt --check apps/application/web_ui/locale/en/LC_MESSAGES/django.po
          msgfmt --check apps/application/web_ui/landing_locale/it/LC_MESSAGES/django.po

  file-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install locked environment
        run: uv sync --locked
      - name: Run file checks
        run: uv run pre-commit run --all-files
      - name: Scan repository history for secrets
        run: uv run pre-commit run gitleaks-history --hook-stage manual --all-files

  application-tests:
    runs-on: ubuntu-latest
    services:
      database:
        image: imresamu/postgis:17-3.5-bookworm@sha256:35fe7dceda62bfe7d2965b0ba78d915ff9f901b5e0466d633ecc58421b5b5210
        env:
          POSTGRES_DB: sporameteo
          POSTGRES_USER: sporameteo
          POSTGRES_PASSWORD: replace-with-a-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sporameteo -d sporameteo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    env:
      SPORAMETEO_DJANGO_SECRET_KEY: django-insecure-ci-placeholder
      SPORAMETEO_DB_NAME: sporameteo
      SPORAMETEO_DB_USER: sporameteo
      SPORAMETEO_DB_PASSWORD: replace-with-a-ci-password
      SPORAMETEO_DB_HOST: 127.0.0.1
      SPORAMETEO_DB_PORT: "5432"
    steps:
      - name: Install geographic libraries
        # The packages come from the Actions cache, so a slow Ubuntu mirror only matters when this list changes.
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: gdal-bin libgdal-dev libgeos-dev libproj-dev gettext
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install locked environment
        run: uv sync --locked
      - name: Compile translation catalogs
        run: uv run python apps/application/manage.py compilemessages --ignore .venv --locale it --locale en
      - name: Check Django configuration
        run: uv run python apps/application/manage.py check
      - name: Check migrations
        run: uv run python apps/application/manage.py makemigrations --check --dry-run
      - name: Apply migrations to the fresh database
        run: uv run python apps/application/manage.py migrate --noinput
      - name: Run application and worker tests
        run: uv run pytest tests/app

  browser-tests:
    uses: ./.github/workflows/browser-checks.yml
    with:
      browser: chromium

  deploy:
    needs: [frontend-checks, file-checks, application-tests, browser-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      DOKKU_REMOTE: dokku@vps.sporameteo.com:sporameteo
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up SSH
        env:
          DOKKU_SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DOKKU_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H vps.sporameteo.com >> ~/.ssh/known_hosts
      - name: Check whether the app changed since the last deploy
        id: changes
        run: |
          # Compare with the commit Dokku runs, not the previous push, so a
          # skipped or replaced run on master never leaves app changes behind.
          deployed=$(git ls-remote "$DOKKU_REMOTE" refs/heads/master | cut -f1)
          if [ -z "$deployed" ] || ! git cat-file -e "$deployed^{commit}"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" "$deployed"; then
            echo "Dokku already runs $deployed, which includes this commit."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$deployed" "$GITHUB_SHA" -- \
            apps src assets pyproject.toml uv.lock package.json package-lock.json \
            postcss.config.cjs tailwind.landing.config.cjs \
            tools/map_checks/package.json tools/map_checks/package-lock.json \
            Dockerfile Procfile app.json .github/workflows/ci.yml)
          if [ -n "$changed" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No app files changed since $deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to Dokku
        if: steps.changes.outputs.deploy == 'true'
        run: git push --force "$DOKKU_REMOTE" "$GITHUB_SHA:refs/heads/master"
